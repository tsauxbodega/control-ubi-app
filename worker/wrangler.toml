name = "tcu-api-proxy"
main = "src/index.js"
compatibility_date = "2026-11-13"
workers_dev = true

[secrets]
required = ["API_TOKEN", "GITHUB_TOKEN"]

[vars]
FIREBASE_PROJECT_ID = "tcutoyotanys"
# Después de crear Pages, agrega aquí su origen exacto https://<proyecto>.pages.dev.
# Mantén el origen anterior durante la transición.
ALLOWED_ORIGINS = "https://tcunorteysur.anys.workers.dev"
# El puente del token estático antiguo queda APAGADO: ese token estuvo visible en versiones anteriores
# de la app y se considera comprometido (ver docs/SEGURIDAD.md). Rótalo antes de volver a usarlo.
ALLOW_LEGACY_API_TOKEN = "false"
# Verificación en dos pasos obligatoria para TODOS los roles (el token debe traer firebase.sign_in_second_factor = totp).
REQUIRE_MFA = "true"
GITHUB_REPO = "tsauxbodega/control-ubi-datos"
GITHUB_FILE = "CONTROL_UBI_cache.xlsx"
GITHUB_REF = "main"

[[vpc_services]]
binding = "PRIVATE_API"
service_id = "01a0a563-a22f-77e3-b1b1-8607051568f4"
